          <main class="page">
            <section class="hero">
              <h1>抽選会の説明</h1>
              <p class="lead">
                このページでは、参加受付の流れや抽選番号の発行方法を案内します。
                スタンプラリーの訪問履歴と連携して抽選番号を出す仕組みなので、受付時は QR を 1 回かざすだけです。
              </p>
            </section>

            <section class="summary">
              <h2>参加の流れ</h2>
              <div class="summary-grid">
                <article class="step">
                  <div class="step-num">1</div>
                  <h2>QRコードを読み取る</h2>
                  <p>参加用QRコードから UUID を取り出して、受付処理に使います。</p>
                </article>
                <article class="step">
                  <div class="step-num">2</div>
                  <h2>スタンプ履歴を確認する</h2>
                  <p>既存の訪問履歴を参照して、抽選会の参加状況を記録します。</p>
                </article>
                <article class="step">
                  <div class="step-num">3</div>
                  <h2>抽選番号を発行する</h2>
                  <p>すでに受付済みなら同じ番号を再表示し、未登録なら新しく発行します。</p>
                </article>
              </div>
            </section>

            <section class="section">
              <h2>受付時のポイント</h2>
              <div class="details">
                <div class="box">
                  <h3>受付対象</h3>
                  <ul>
                    <li>kosen-entry:&lt;UUID&gt;</li>
                    <li>visitor:&lt;UUID&gt;</li>
                    <li>UUID 文字列そのもの</li>
                  </ul>
                </div>
                <div class="box">
                  <h3>注意事項</h3>
                  <ul>
                    <li>同じ UUID は重複発行しません。</li>
                    <li>通信状況が悪い場合は再読み取りしてください。</li>
                    <li>必要なら手動入力でも受付できます。</li>
                  </ul>
                </div>
              </div>
              <div class="footer">
                <div class="note">参加受付は <a href="/lottery-entry.html">こちら</a> から行えます。</div>
                <a class="btn primary" href="/lottery-entry.html">参加受付へ進む</a>
              </div>
            </section>
